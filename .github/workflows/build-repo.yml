name: Build and Deploy Repository

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools & Dependencies
        run: |
          brew install dos2unix dpkg ldid

      - name: Install Theos & Patched SDKs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --recursive https://github.com/theos/theos.git /Users/runner/theos
          echo "THEOS=/Users/runner/theos" >> $GITHUB_ENV
          echo "/Users/runner/theos/bin" >> $GITHUB_PATH
          
          mkdir -p /Users/runner/theos/sdks
          curl -fsSL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz | tar -xJ -C /Users/runner/theos/sdks/ 2>/dev/null || \
          git clone --depth=1 https://github.com/xybp888/iOS-SDKs.git /tmp/sdks && cp -r /tmp/sdks/iPhoneOS*.sdk /Users/runner/theos/sdks/ 2>/dev/null || true

      - name: Build VideoApp DEB
        run: |
          cd app
          find . -type f -exec dos2unix {} +
          chmod -R 755 layout/DEBIAN 2>/dev/null || true
          make clean
          make package FINALPACKAGE=1

      - name: Build DeviceStats DEB
        run: |
          cd infoapp
          find . -type f -exec dos2unix {} +
          chmod -R 755 layout/DEBIAN 2>/dev/null || true
          make clean
          make package FINALPACKAGE=1

      - name: Prepare Clean Repo Structure
        run: |
          mkdir -p public/debs
          touch public/.nojekyll
          
          # Copy các file deb mới nhất vào thư mục debs của public
          cp -f app/packages/*.deb public/debs/
          cp -f infoapp/packages/*.deb public/debs/
          
          cd public
          # Quét sinh danh sách Packages
          dpkg-scanpackages debs /dev/null > Packages
          bzip2 -f -k -9 Packages
          gzip -f -k -9 Packages
          
          # Tạo file Release chuẩn APT
          cat << 'EOF' > Release
          Origin: ZheeDev Repo
          Label: ZheeDev
          Suite: stable
          Version: 1.0
          Codename: ios
          Architectures: iphoneos-arm64
          Components: main
          Description: ZheeDev iOS Jailbreak Repository
          EOF

      - name: Deploy Clean Repository to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true