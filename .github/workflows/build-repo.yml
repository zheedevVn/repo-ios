name: Build and Deploy Repository

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Theos & Tools
        run: |
          brew install dos2unix dpkg
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=/Users/runner/theos" >> $GITHUB_ENV
          echo "/Users/runner/theos/bin" >> $GITHUB_PATH

      - name: Build VideoApp DEB
        run: |
          cd app
          find . -type f -exec dos2unix {} +
          make package FINALPACKAGE=1
          mkdir -p ../debs
          cp -f packages/*.deb ../debs/

      - name: Build DeviceStats DEB
        run: |
          cd infoapp
          find . -type f -exec dos2unix {} +
          make package FINALPACKAGE=1
          cp -f packages/*.deb ../debs/

      - name: Scan APT Packages Index and Release
        run: |
          cd $GITHUB_WORKSPACE
          dpkg-scanpackages -m ./debs > Packages
          bzip2 -f -k Packages
          gzip -f -k Packages
          
          echo "Origin: ZheeDev Repo" > Release
          echo "Label: ZheeDev" >> Release
          echo "Suite: stable" >> Release
          echo "Version: 1.0" >> Release
          echo "Codename: ios" >> Release
          echo "Architectures: iphoneos-arm64" >> Release
          echo "Components: main" >> Release
          echo "Description: ZheeDev iOS Jailbreak Repository" >> Release

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./