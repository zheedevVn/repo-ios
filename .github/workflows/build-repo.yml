name: Build App and Update Repo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          brew install ldid dpkg xz zstd

      - name: Install Theos and iOS SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          rm -rf $HOME/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git $HOME/theos/sdks
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build Application DEB
        run: |
          cd app
          chmod +x postinst || true
          make package FINALPACKAGE=1
          mkdir -p ../repo/debs
          cp -f packages/*.deb ../repo/debs/

      - name: Generate APT Packages Index and Release
        run: |
          cd repo
          dpkg-scanpackages -m debs /dev/null > Packages
          gzip -c -9 Packages > Packages.gz
          bzip2 -c -9 Packages > Packages.bz2
          xz -c -9 Packages > Packages.xz
          zstd -c -19 Packages > Packages.zst
          cp ../Release ./
          cp ../index.html ./

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages