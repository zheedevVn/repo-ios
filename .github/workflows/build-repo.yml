name: Build and Deploy Repository

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools & Dependencies
        run: |
          brew install dos2unix dpkg ldid

      - name: Install Theos & Patched SDKs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --recursive https://github.com/theos/theos.git /Users/runner/theos
          echo "THEOS=/Users/runner/theos" >> $GITHUB_ENV
          echo "/Users/runner/theos/bin" >> $GITHUB_PATH
          
          mkdir -p /Users/runner/theos/sdks
          curl -fsSL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz | tar -xJ -C /Users/runner/theos/sdks/ 2>/dev/null || \
          git clone --depth=1 https://github.com/xybp888/iOS-SDKs.git /tmp/sdks && cp -r /tmp/sdks/iPhoneOS*.sdk /Users/runner/theos/sdks/ 2>/dev/null || true

      - name: Build VideoApp DEB
        run: |
          cd app
          find . -type f -exec dos2unix {} +
          chmod -R 755 layout/DEBIAN 2>/dev/null || true
          make package FINALPACKAGE=1
          mkdir -p ../debs
          cp -f packages/*.deb ../debs/

      - name: Build DeviceStats DEB
        run: |
          cd infoapp
          find . -type f -exec dos2unix {} +
          chmod -R 755 layout/DEBIAN 2>/dev/null || true
          make package FINALPACKAGE=1
          mkdir -p ../debs
          cp -f packages/*.deb ../debs/

      - name: Scan APT Packages Index and Release
        run: |
          cd $GITHUB_WORKSPACE
          touch .nojekyll
          dpkg-scanpackages -m debs /dev/null > Packages
          bzip2 -f -k Packages
          gzip -f -k Packages
          
          echo "Origin: ZheeDev Repo" > Release
          echo "Label: ZheeDev" >> Release
          echo "Suite: stable" >> Release
          echo "Version: 1.0" >> Release
          echo "Codename: ios" >> Release
          echo "Architectures: iphoneos-arm64" >> Release
          echo "Components: main" >> Release
          echo "Description: ZheeDev iOS Jailbreak Repository" >> Release

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          force_orphan: true